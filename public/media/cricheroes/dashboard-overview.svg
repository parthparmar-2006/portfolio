<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Placeholder: dashboard hero view of the impact metric project">
  <rect width="1600" height="900" fill="#FCF8F1"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1600" height="76" fill="#2F6B47"/>
  <g font-family="ui-sans-serif, system-ui" fill="#EAF3ED">
    <text x="64" y="48" font-size="24">Impact Metric</text>
    <text x="1180" y="47" font-size="17" fill-opacity="0.75">Season 2026</text>
  </g>
  <rect x="1350" y="22" width="186" height="32" rx="16" fill="#EAF3ED" fill-opacity="0.18"/>

  <!-- hero statement -->
  <g font-family="ui-sans-serif, system-ui" fill="#2B2620">
    <text x="64" y="176" font-size="44">What was that innings worth?</text>
    <text x="64" y="220" font-size="20" fill="#6B6155">Performance weighted by match pressure and recency, not by raw volume.</text>
  </g>

  <!-- KPI tiles -->
  <g>
    <rect x="64" y="264" width="352" height="180" rx="14" fill="#F7F1E6" stroke="#DED2BE" stroke-width="2"/>
    <text x="96" y="312" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#9A8F80">TOP IMPACT</text>
    <text x="96" y="382" font-family="ui-sans-serif, system-ui" font-size="56" fill="#2F6B47">94.2</text>
    <text x="96" y="418" font-family="ui-sans-serif, system-ui" font-size="17" fill="#6B6155">chasing, 4 down, 38 needed</text>
  </g>
  <g>
    <rect x="448" y="264" width="352" height="180" rx="14" fill="#F7F1E6" stroke="#DED2BE" stroke-width="2"/>
    <text x="480" y="312" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#9A8F80">MATCHES SCORED</text>
    <text x="480" y="382" font-family="ui-sans-serif, system-ui" font-size="56" fill="#2B2620">1,046</text>
    <text x="480" y="418" font-family="ui-sans-serif, system-ui" font-size="17" fill="#6B6155">across four seasons</text>
  </g>
  <g>
    <rect x="832" y="264" width="352" height="180" rx="14" fill="#F7F1E6" stroke="#DED2BE" stroke-width="2"/>
    <text x="864" y="312" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#9A8F80">RANK MOVEMENT</text>
    <text x="864" y="382" font-family="ui-sans-serif, system-ui" font-size="56" fill="#9A4A1E">+17</text>
    <text x="864" y="418" font-family="ui-sans-serif, system-ui" font-size="17" fill="#6B6155">vs. batting average rank</text>
  </g>
  <g>
    <rect x="1216" y="264" width="320" height="180" rx="14" fill="#2F6B47" fill-opacity="0.1" stroke="#2F6B47" stroke-opacity="0.3" stroke-width="2"/>
    <text x="1248" y="312" font-family="ui-monospace, monospace" font-size="14" letter-spacing="2" fill="#2F6B47">PRESSURE WEIGHT</text>
    <g stroke="#2F6B47" stroke-width="4" fill="none" stroke-linecap="round">
      <path d="M1248 402 C 1300 400, 1330 356, 1382 340 S 1462 300, 1504 322"/>
    </g>
    <circle cx="1504" cy="322" r="8" fill="#2F6B47"/>
  </g>

  <!-- ranked bars -->
  <rect x="64" y="484" width="1472" height="352" rx="14" fill="#F7F1E6" stroke="#DED2BE" stroke-width="2"/>
  <text x="96" y="532" font-family="ui-sans-serif, system-ui" font-size="21" fill="#2B2620">Impact vs. conventional average</text>
  <g font-family="ui-monospace, monospace" font-size="15" fill="#6B6155">
    <text x="96" y="590">Player A</text><text x="96" y="640">Player B</text>
    <text x="96" y="690">Player C</text><text x="96" y="740">Player D</text>
    <text x="96" y="790">Player E</text>
  </g>
  <g>
    <rect x="240" y="572" width="980" height="22" rx="11" fill="#2F6B47"/>
    <rect x="240" y="600" width="620" height="14" rx="7" fill="#DED2BE"/>
    <rect x="240" y="622" width="820" height="22" rx="11" fill="#2F6B47"/>
    <rect x="240" y="650" width="880" height="14" rx="7" fill="#DED2BE"/>
    <rect x="240" y="672" width="700" height="22" rx="11" fill="#2F6B47"/>
    <rect x="240" y="700" width="430" height="14" rx="7" fill="#DED2BE"/>
    <rect x="240" y="722" width="560" height="22" rx="11" fill="#2F6B47"/>
    <rect x="240" y="750" width="740" height="14" rx="7" fill="#DED2BE"/>
    <rect x="240" y="772" width="410" height="22" rx="11" fill="#2F6B47"/>
    <rect x="240" y="800" width="300" height="14" rx="7" fill="#DED2BE"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="14" fill="#9A8F80">
    <rect x="1290" y="560" width="16" height="16" rx="4" fill="#2F6B47"/><text x="1316" y="574">impact</text>
    <rect x="1290" y="588" width="16" height="16" rx="4" fill="#DED2BE"/><text x="1316" y="602">average</text>
  </g>

  <!-- placeholder watermark -->
  <g font-family="ui-monospace, monospace" font-size="18" letter-spacing="3">
    <rect x="1334" y="180" width="196" height="38" rx="19" fill="#2B2620" fill-opacity="0.08"/>
    <text x="1358" y="205" fill="#9A8F80">PLACEHOLDER</text>
  </g>
</svg>
