<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Placeholder: in-depth single player analysis view">
  <rect width="1600" height="900" fill="#FCF8F1"/>
