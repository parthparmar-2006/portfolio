<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Placeholder cover: exploratory flight paths converging into one optimised trajectory">
  <rect width="1600" height="1000" fill="#EDEEF8"/>
  <g stroke="#31479E" stroke-opacity="0.1" stroke-width="1.5">
    <path d="M0 200 H1600 M0 400 H1600 M0 600 H1600 M0 800 H1600"/>
    <path d="M200 0 V1000 M400 0 V1000 M600 0 V1000 M800 0 V1000 M1000 0 V1000 M1200 0 V1000 M1400 0 V1000"/>
  </g>

  <!-- obstacles -->
  <g fill="#31479E" fill-opacity="0.16">
    <rect x="420" y="180" width="150" height="330" rx="10"/>
    <rect x="700" y="560" width="150" height="300" rx="10"/>
    <rect x="1000" y="200" width="150" height="280" rx="10"/>
  </g>

  <!-- exploratory paths -->
  <g fill="none" stroke="#31479E" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <path d="M180 800 C 380 720, 340 480, 560 560 S 760 400, 900 500 S 1120 620, 1300 480"/>
    <path d="M180 800 C 300 620, 480 640, 620 700 S 820 480, 980 560 S 1180 400, 1320 460"/>
    <path d="M180 800 C 420 840, 560 700, 700 540 S 860 620, 1020 540 S 1200 560, 1340 500"/>
    <path d="M180 800 C 260 700, 400 760, 520 660 S 700 760, 860 660 S 1060 480, 1260 520"/>
    <path d="M180 800 C 340 560, 460 540, 600 620 S 780 700, 940 620 S 1120 500, 1280 540"/>
    <path d="M180 800 C 300 780, 420 700, 580 720 S 800 620, 960 680 S 1160 620, 1300 560"/>
  </g>

  <!-- converged trajectory -->
  <path d="M180 800 C 400 760, 560 600, 760 520 S 1080 420, 1300 396"
        fill="none" stroke="#31479E" stroke-width="10" stroke-linecap="round"/>

  <!-- start -->
  <circle cx="180" cy="800" r="18" fill="#31479E"/>
  <text x="140" y="862" font-family="ui-monospace, monospace" font-size="22" letter-spacing="3" fill="#31479E">START</text>

  <!-- target -->
  <circle cx="1310" cy="394" r="76" fill="#2F6B47" fill-opacity="0.15"/>
  <circle cx="1310" cy="394" r="26" fill="#2F6B47"/>
  <circle cx="1310" cy="394" r="46" fill="none" stroke="#2F6B47" stroke-width="4"/>
  <text x="1252" y="290" font-family="ui-monospace, monospace" font-size="22" letter-spacing="3" fill="#2F6B47">TARGET</text>

  <!-- policy label -->
  <g font-family="ui-monospace, monospace" font-size="22" fill="#31479E">
    <rect x="120" y="120" width="440" height="110" rx="14" fill="#31479E" fill-opacity="0.09"/>
    <text x="152" y="168" letter-spacing="3">CNN → GRU → ACTOR</text>
    <text x="152" y="204" font-size="19" fill-opacity="0.7">partial observability, continuous control</text>
  </g>

  <g font-family="ui-monospace, monospace" font-size="20" letter-spacing="3">
    <rect x="1290" y="880" width="206" height="42" rx="21" fill="#31479E" fill-opacity="0.12"/>
    <text x="1314" y="908" fill="#31479E" fill-opacity="0.75">PLACEHOLDER</text>
  </g>
</svg>
