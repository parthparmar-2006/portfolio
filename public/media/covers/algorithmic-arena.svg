<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Placeholder cover: submission pipeline from queue through isolated containers to a verdict">
  <rect width="1600" height="1000" fill="#F4EAD9"/>
  <g stroke="#9A4A1E" stroke-opacity="0.1" stroke-width="1.5">
    <path d="M0 200 H1600 M0 400 H1600 M0 600 H1600 M0 800 H1600"/>
    <path d="M200 0 V1000 M400 0 V1000 M600 0 V1000 M800 0 V1000 M1000 0 V1000 M1200 0 V1000 M1400 0 V1000"/>
  </g>

  <!-- incoming submissions -->
  <g fill="#9A4A1E">
    <rect x="120" y="300" width="120" height="76" rx="10" fill-opacity="0.9"/>
    <rect x="120" y="404" width="120" height="76" rx="10" fill-opacity="0.65"/>
    <rect x="120" y="508" width="120" height="76" rx="10" fill-opacity="0.45"/>
    <rect x="120" y="612" width="120" height="76" rx="10" fill-opacity="0.28"/>
  </g>
  <text x="120" y="270" font-family="ui-monospace, monospace" font-size="24" letter-spacing="3" fill="#9A4A1E">SUBMIT</text>

  <!-- queue -->
  <g stroke="#9A4A1E" stroke-width="4" fill="none">
    <path d="M256 338 H392" marker-end="url(#a)"/>
    <path d="M256 442 H392"/>
    <path d="M256 546 H392"/>
    <path d="M256 650 H392"/>
  </g>
  <rect x="408" y="288" width="112" height="416" rx="16" fill="none" stroke="#9A4A1E" stroke-width="5" stroke-dasharray="16 12"/>
  <text x="408" y="270" font-family="ui-monospace, monospace" font-size="24" letter-spacing="3" fill="#9A4A1E">QUEUE</text>
  <g fill="#9A4A1E" fill-opacity="0.5">
    <rect x="432" y="316" width="64" height="52" rx="8"/>
    <rect x="432" y="384" width="64" height="52" rx="8"/>
    <rect x="432" y="452" width="64" height="52" rx="8"/>
  </g>

  <!-- bounded worker pool -->
  <rect x="640" y="240" width="480" height="520" rx="20" fill="#F9F2E6" stroke="#9A4A1E" stroke-width="5"/>
  <text x="640" y="216" font-family="ui-monospace, monospace" font-size="24" letter-spacing="3" fill="#9A4A1E">ISOLATED RUNNERS</text>
  <g>
    <rect x="688" y="296" width="176" height="130" rx="14" fill="#9A4A1E" fill-opacity="0.14" stroke="#9A4A1E" stroke-width="3"/>
    <rect x="896" y="296" width="176" height="130" rx="14" fill="#9A4A1E" fill-opacity="0.14" stroke="#9A4A1E" stroke-width="3"/>
    <rect x="688" y="458" width="176" height="130" rx="14" fill="#9A4A1E" fill-opacity="0.14" stroke="#9A4A1E" stroke-width="3"/>
    <rect x="896" y="458" width="176" height="130" rx="14" fill="#F4EAD9" stroke="#9A4A1E" stroke-width="3" stroke-dasharray="10 8"/>
  </g>
  <g font-family="ui-monospace, monospace" font-size="19" fill="#9A4A1E">
    <text x="712" y="366">cpu · mem</text><text x="920" y="366">cpu · mem</text>
    <text x="712" y="528">cpu · mem</text><text x="920" y="528" fill-opacity="0.45">idle</text>
  </g>
  <g font-family="ui-monospace, monospace" font-size="17" fill="#9A4A1E" fill-opacity="0.6">
    <text x="688" y="648">no network · non-root · destroyed after one use</text>
  </g>

  <!-- verdict -->
  <path d="M1136 500 H1300" stroke="#9A4A1E" stroke-width="5" fill="none"/>
  <path d="M1284 484 L1308 500 L1284 516 Z" fill="#9A4A1E"/>
  <rect x="1324" y="416" width="160" height="168" rx="16" fill="#9A4A1E"/>
  <g font-family="ui-monospace, monospace" fill="#F9F2E6">
    <text x="1352" y="486" font-size="24" letter-spacing="2">AC</text>
    <text x="1352" y="530" font-size="17" fill-opacity="0.7">WA TLE</text>
    <text x="1352" y="558" font-size="17" fill-opacity="0.7">MLE RE</text>
  </g>
  <text x="1324" y="392" font-family="ui-monospace, monospace" font-size="24" letter-spacing="3" fill="#9A4A1E">VERDICT</text>

  <g font-family="ui-monospace, monospace" font-size="20" letter-spacing="3">
    <rect x="1290" y="880" width="206" height="42" rx="21" fill="#9A4A1E" fill-opacity="0.12"/>
    <text x="1314" y="908" fill="#9A4A1E" fill-opacity="0.75">PLACEHOLDER</text>
  </g>
</svg>
