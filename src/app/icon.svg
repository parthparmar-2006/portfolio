<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Favicon: PP monogram, cream on rust.
       Fraunces is not available to a favicon renderer, so the letterforms are
       drawn as paths rather than set as text — that also keeps the mark
       identical across browsers instead of falling back to a system serif. -->
  <rect width="64" height="64" rx="14" fill="#9A4A1E"/>

  <!-- First P -->
  <path d="M11 15h13.2c6.1 0 9.8 3.3 9.8 8.7 0 5.6-3.9 9-10.2 9h-5.9V49H11V15Zm6.9 5.4v6.9h5c2.6 0 4.1-1.3 4.1-3.5 0-2.2-1.5-3.4-4.1-3.4h-5Z" fill="#F7F1E6"/>

  <!-- Second P, overlapping and tinted back, so the mark reads as a monogram
       rather than as two separate letters at 16px. -->
  <path d="M31 15h13.2c6.1 0 9.8 3.3 9.8 8.7 0 5.6-3.9 9-10.2 9h-5.9V49H31V15Zm6.9 5.4v6.9h5c2.6 0 4.1-1.3 4.1-3.5 0-2.2-1.5-3.4-4.1-3.4h-5Z" fill="#F7F1E6" fill-opacity="0.62"/>
</svg>
